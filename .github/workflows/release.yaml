name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  go-version: 1.25

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: git fetch --force --tags
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.go-version }}
          cache: true

      # Fork release: build cross-platform binaries + checksums and publish a
      # GitHub Release on this repo. Docker push and Homebrew tap are skipped
      # (they require milvusdb / tap credentials that a fork does not have).
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --skip=homebrew
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
